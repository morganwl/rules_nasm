name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, windows-2022]
        bazel_version: [7.x, 8.x, 9.x]
        config: ["", path_mapping]
        exclude:
          # Bazel 7.x's Java rules (used by stardoc) fail to produce outputs
          # with `--experimental_output_paths=strip`.
          - bazel_version: 7.x
            config: path_mapping
          # Path mapping requires a sandbox, which is not available on Windows.
          - os: windows-2022
            config: path_mapping
    name: test (${{ matrix.os }}, ${{ matrix.bazel_version }}${{ matrix.config && format(', {0}', matrix.config) || '' }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: 'read'
      packages: 'read'
      id-token: 'write'
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
      BAZEL_CONFIG: ${{ matrix.config && format('--config={0}', matrix.config) || '' }}
    steps:
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          disk-cache: true
          bazelisk-cache: true
          repository-cache: true
      - uses: actions/checkout@v4
      - name: Unit tests
        run:
          bazel
          --bazelrc=${{ github.workspace }}/.github/ci.bazelrc
          test //...
          ${{ env.BAZEL_CONFIG }}
      - name: e2e tests
        run:
          e2e/test.sh
          --bazelrc=${{ github.workspace }}/.github/ci.bazelrc
          ${{ env.BAZEL_CONFIG }}
      - name: Analyze examples
        # The example depends on a cross compiler which is not installed, so
        # only analysis is performed.
        if: runner.os == 'Linux'
        working-directory: examples/cross_compilation
        run:
          bazel
          --bazelrc=${{ github.workspace }}/.github/ci.bazelrc
          build --nobuild //...
          ${{ env.BAZEL_CONFIG }}

  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Buildifier
        run: |
          wget "https://github.com/bazelbuild/buildtools/releases/download/v${BUILDIFIER_VERSION}/buildifier-linux-amd64" -O buildifier
          chmod +x ./buildifier
          ./buildifier -lint=warn -mode=check -warnings=all -r ${{ github.workspace }}
          rm ./buildifier
        env:
          BUILDIFIER_VERSION: 8.0.2
